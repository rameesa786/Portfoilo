<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificates</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      margin: 0;
      padding: 40px 20px;
      color: #fff;
    }

    .container {
      max-width: 900px;
      margin: auto;
      text-align: center;
    }

    h2 {
      margin-bottom: 40px;
      font-size: 28px;
      font-weight: 600;
      color: #b6ede9;
      text-shadow: 0 0 10px rgba(182, 237, 233, 0.8);
    }

    .certificate-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 25px;
      margin-bottom: 25px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .certificate-box:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .certificate-info {
      flex: 1;
      font-size: 18px;
      font-weight: 500;
      text-align: left;
      color: #f1f1f1;
    }

    .view-btn {
      text-decoration: none;
      background: #00bfff;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(0, 191, 255, 0.4);
    }

    .view-btn:hover {
      background: #009acd;
      box-shadow: 0 6px 20px rgba(0, 191, 255, 0.6);
    }

    /* Back Button */
    .back-btn {
      margin-top: 3rem;
      display: inline-block;
      background: linear-gradient(90deg, #00f5c8, #00d9ff);
      color: #000;
      padding: 12px 26px;
      border-radius: 2rem;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: transparent;
      color: #00f5c8;
      border: 2px solid #00f5c8;
      box-shadow: 0 0 15px rgba(0, 255, 200, 0.4);
    }
    
  </style>
</head>
<body>
  <div class="container">
    <h2>My Certificates</h2>

    <div class="certificate-box">
      <div class="certificate-info">MICROSOFT_AI_AZURE - AIML Intern</div>
      <a href="MICROSOFT_AI_AZURE.jpg" target="_blank" class="view-btn">View Certificate</a>
    </div>

    <div class="certificate-box">
      <div class="certificate-info">TECH SAKSHAM EDUNET - AIML Intern</div>
      <a href="TECHSAKSHAM.png" target="_blank" class="view-btn">View Certificate</a>
    </div>

    

  <a href="index.html" class="back-btn">⬅ Back to Portfolio</a>
</body>
</html>
